<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#141414" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="WexSuperAdmin" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<link rel="manifest" href="./manifest.webmanifest?v=3" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png?v=3" />
<link rel="icon" href="./favicon-32.png?v=3" type="image/png" />
<link rel="icon" href="./icon.svg?v=3" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet" />
<title>WexSuperAdmin</title>
<style>
:root{--bg:#f6f3ea;--ink:#141414;--mu:#5c574b;--line:#d8d1bf;--wy:#f5c000;--wy2:#fff2bf;--card:#fff;--pen:#c62828;--pet:#1f6b3b;--blu:#1d4f91;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--ink:#f1ede2;--mu:#aaa392;--line:#3a372f;--card:#1e1d1a;--wy2:#3a3215;--pen:#ff7366;--pet:#6cc58a;--blu:#8db6ef;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Oswald,system-ui,sans-serif;font-weight:700;letter-spacing:.01em;margin:0}
h1{font-size:1.5rem}h2{font-size:1.15rem;margin-bottom:10px}h3{font-size:1rem;margin:16px 0 6px}
a{color:var(--blu)}.mut{color:var(--mu)}small{font-size:.8rem}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;background:#141414;color:#f1ede2;padding:10px 18px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
header h1{font-size:1.15rem;flex:1}header h1 b{color:var(--wy)}
header .who{font-size:.85rem;opacity:.85}
header button{background:transparent;border:1px solid #555;color:#f1ede2;border-radius:8px;padding:6px 10px;font:inherit;font-size:.85rem;cursor:pointer}
.wrap{display:flex;min-height:calc(100vh - 52px)}
aside{width:210px;flex:none;border-right:1px solid var(--line);padding:14px 10px;background:var(--card)}
aside button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:transparent;font:inherit;color:var(--ink);padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:2px}
aside button:hover{background:var(--wy2)}aside button.on{background:var(--wy);color:#141414;font-weight:700}
.badge{font-size:.72rem;font-weight:700;background:var(--pen);color:#fff;border-radius:20px;padding:1px 7px;min-width:20px;text-align:center}
aside button.on .badge{background:#141414}
main{flex:1;min-width:0;padding:20px 24px 60px;max-width:1300px}
.sub{margin:2px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.kpi:hover{border-color:var(--wy)}
.kpi b{display:block;font:700 1.9rem/1.1 Oswald,system-ui,sans-serif}.kpi span{font-size:.82rem;color:var(--mu)}
.kpi.warn b{color:var(--pen)}.kpi.ok b{color:var(--pet)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.todo{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}.todo:first-of-type{border-top:0}
.todo .t{flex:1;min-width:200px}
.btn{font:inherit;font-size:.85rem;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}.btn.pri{background:var(--wy);border-color:var(--wy);color:#141414}.btn.dng{color:var(--pen)}.btn.big{padding:10px 16px;font-size:.95rem}
.btn:disabled{opacity:.45;cursor:default}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
input[type=search]{min-width:220px}input[type=checkbox]{width:17px;height:17px;accent-color:#c99c00;cursor:pointer}
textarea{width:100%;min-height:80px;resize:vertical}
.tw{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{position:sticky;top:0;background:var(--card);text-align:left;font-weight:600;color:var(--mu);font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--wy2)}
td select{padding:4px 6px;font-size:.85rem}
.nm{font-weight:600;cursor:pointer;color:var(--ink);background:none;border:0;padding:0;font:inherit;text-align:left}.nm:hover{text-decoration:underline}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:20px;padding:1px 8px;margin:1px 3px 1px 0;color:var(--mu);white-space:nowrap}
.tag.ok{color:var(--pet);border-color:var(--pet)}.tag.warn{color:var(--pen);border-color:var(--pen)}.tag.y{background:var(--wy2);border-color:var(--wy);color:var(--ink)}.tag.b{color:var(--blu);border-color:var(--blu)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.okTxt{color:var(--pet)}.warnTxt{color:var(--pen)}
.msg{border-left:4px solid var(--line)}.msg.new{border-left-color:var(--wy)}.msg p{margin:6px 0;white-space:pre-line}
.reply{background:var(--bg);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:.88rem;white-space:pre-line}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--card);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.15);z-index:40;overflow:auto;padding:18px 20px 40px}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:39}
.dl{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:.88rem;margin:8px 0}.dl dt{color:var(--mu)}.dl dd{margin:0;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}
.modal>div{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:420px}
.modal p{white-space:pre-line;margin-top:0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#141414;color:#fff;padding:10px 16px;border-radius:12px;z-index:70;font-size:.9rem;max-width:90vw}
.login{max-width:380px;margin:12vh auto;padding:0 16px}
.login input{width:100%;margin:6px 0 10px;padding:11px 12px}
.login .btn{width:100%}
.err{background:var(--wy2);border:1px solid var(--wy);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.9rem}
.progress{height:8px;border-radius:5px;background:var(--line);overflow:hidden;min-width:70px}.progress i{display:block;height:100%;background:var(--wy)}.progress i.ok{background:var(--pet)}
.empty{color:var(--mu);padding:14px 0}
.sel-bar{position:sticky;bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#141414;color:#fff;border-radius:12px;padding:8px 12px;margin-top:10px}
.sel-bar .btn{background:#2a2a2a;color:#fff;border-color:#444}
@media (max-width:860px){
  .wrap{display:block}
  aside{width:auto;display:flex;overflow-x:auto;gap:4px;border-right:0;border-bottom:1px solid var(--line);padding:8px;position:sticky;top:52px;z-index:15}
  aside button{width:auto;white-space:nowrap;gap:6px;padding:8px 10px}
  main{padding:14px 12px 60px}.cols{grid-template-columns:1fr}
  header .who{display:none}
}
</style>
</head>
<body>

<!-- Anmeldung -->
<section id="vLogin" class="login" hidden>
  <img src="./icon-192.png?v=3" alt="" width="72" height="72" style="border-radius:16px;display:block;margin-bottom:12px" /><h1>Wex<span style="color:#c99c00">SuperAdmin</span></h1>
  <p class="mut">Nur für den Super-Admin. Anmeldung mit dem Konto der Strichliste.</p>
  <form id="fLogin">
    <input id="lMail" type="email" placeholder="E-Mail" autocomplete="username" required />
    <input id="lPw" type="password" placeholder="Passwort" autocomplete="current-password" required />
    <button class="btn pri big" type="submit">Anmelden</button>
  </form>
  <div id="lErr" class="err" hidden></div>
</section>

<section id="vLoad" class="login"><p class="mut">Lädt …</p></section>

<section id="vDenied" class="login" hidden>
  <h1>Kein Zugriff</h1>
  <p>Dieses Konto ist kein Super-Admin. Die Verwaltung ist nur für Super-Admins freigegeben.</p>
  <button class="btn big" id="bDeniedOut">Abmelden</button>
</section>

<!-- App -->
<div id="vApp" hidden>
  <header>
    <img src="./favicon-32.png?v=3" alt="" width="26" height="26" style="border-radius:6px" /><h1>Wex<b>SuperAdmin</b></h1>
    <span class="who" id="who"></span>
    <button id="bInst" hidden>App installieren</button>
    <button id="bOut">Abmelden</button>
  </header>
  <div class="wrap">
    <aside id="nav">
      <button data-v="home">Übersicht <span class="badge" id="nbHome" hidden></span></button>
      <button data-v="members">Mitglieder <span class="badge" id="nbMembers" hidden></span></button>
      <button data-v="rights">Rechte <span class="badge" id="nbRights" hidden></span></button>
      <button data-v="recon">Abgleich <span class="badge" id="nbRecon" hidden></span></button>
      <button data-v="hours">Pflichtstunden</button>
      <button data-v="inbox">Posteingang <span class="badge" id="nbInbox" hidden></span></button>
      <button data-v="log">Protokoll</button>
      <button data-v="links">Links &amp; Hilfe</button>
    </aside>
    <main id="main"></main>
  </div>
</div>

<div class="shade" id="shade" hidden></div>
<div class="drawer" id="drawer" hidden></div>
<div class="modal" id="modal" hidden><div><p id="mT"></p><input id="mI" hidden style="width:100%;margin-bottom:10px" /><textarea id="mA" hidden style="margin-bottom:10px"></textarea><div class="acts" id="mB"></div></div></div>
<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
/* =========================================================
   KONFIGURATION – dieselbe Firebase-Web-App wie Strichliste und Stundentracker.
   Der Web-API-Schlüssel darf öffentlich sein; geschützt sind die Daten durch die
   Firestore-Regeln (nur Nutzer-IDs in superUids() dürfen hier lesen und schreiben).
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyAnNipndzNRd1jmZf_bJ0f4EqcQv5h6wBg",
  authDomain: "wexhainis-getraenkestrichliste.firebaseapp.com",
  projectId: "wexhainis-getraenkestrichliste",
  storageBucket: "wexhainis-getraenkestrichliste.firebasestorage.app",
  messagingSenderId: "561283415943",
  appId: "1:561283415943:web:56e161ccaac34529421d22"
};
const FB = 'https://www.gstatic.com/firebasejs/13.4.0/';
const APP_VERSION = '1.3.0';
const URL_SL = 'https://firestorm1902.github.io/wexhainis-strichliste/';
const URL_ST = 'https://firestorm1902.github.io/wexhainis-stundentracker/';
const FC = 'https://console.firebase.google.com/project/wexhainis-getraenkestrichliste/';
/* ========================================================= */

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = n => (+n || 0).toLocaleString('de-DE', { maximumFractionDigits: 2 });
const eur = n => (+n || 0).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
const r2 = n => Math.round(n * 100) / 100;
const dt = t => t ? new Date(t).toLocaleDateString('de-DE') : '–';
const dtt = t => t ? new Date(t).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '–';
const todayISO = () => new Date().toLocaleDateString('sv-SE');
const curYear = () => String(new Date().getFullYear());
let toastT;
function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3500); }

/* ---------- Dialoge ---------- */
function dialog(text, buttons, opt = {}) {
  return new Promise(res => {
    $('mT').textContent = text;
    const inp = opt.textarea ? $('mA') : $('mI');
    $('mI').hidden = true; $('mA').hidden = true;
    if (opt.input != null) { inp.hidden = false; inp.value = opt.input; inp.placeholder = opt.placeholder || ''; setTimeout(() => inp.focus(), 30); }
    const box = $('mB'); box.replaceChildren();
    buttons.forEach((b, i) => {
      const e = document.createElement('button'); e.className = 'btn big' + (i === 0 ? (opt.danger ? ' dng' : ' pri') : ''); e.textContent = b;
      e.onclick = () => { $('modal').hidden = true; res({ i, v: opt.input != null ? inp.value : null }); };
      box.append(e);
    });
    $('modal').hidden = false;
  });
}
const ask = async (t, ok = 'Ja', danger = false) => (await dialog(t, [ok, 'Abbrechen'], { danger })).i === 0;

/* ---------- Zustand ---------- */
const S = {
  user: null, isSuper: false, me: '', view: 'home',
  users: {}, groups: [], msgs: [], reqs: [], log: [], std: [], soll: [], inv: [], rem: [], cfg: {},
  stdYear: curYear(), counts: {}, err: {},
  mf: { q: '', status: '', role: '', std: '', grp: '', sort: 'name' }, sel: new Set(),
  inboxF: 'open', days: [], products: [], activeDay: null, recon: { list: {}, busy: false, t: 0, n: 0, done: 0 }, reconF: 'diff', logF: { type: '', q: '' }, hoursF: '', drawer: null, memberStats: {}
};
let F = {}, db, auth;
const unsub = {};
const stop = k => { if (unsub[k]) { unsub[k](); delete unsub[k]; } };

const ROLE = { '': 'Mitglied', admin: 'Getränke-Admin', vorstand: 'Vorstand' };
const SR = { '': '–', vorstand: 'Vorstand', admin: 'Stunden-Admin' };
const STATUS = { aktiv: 'aktiv', wartend: 'wartet', gesperrt: 'gesperrt', entfernt: 'entfernt' };
const LOGT = { person: 'Personen', buchung: 'Buchungen', einladen: 'Einladen', getraenk: 'Getränke', tag: 'Tage', egg: 'Easter Eggs', system: 'System' };
const DEFAULT_GROUPS = [{ id: 'wefzg', name: 'Wilde Wefzg' }, { id: 'wache', name: 'Wespenwache' }, { id: 'glauer', name: 'Gloggenglauer' }, { id: 'goischd', name: 'Hofgoischd' }, { id: 'hexe', name: 'Taubentalhexe' }];
const CFG_DEF = { soll: 6, rate: 0, days: 14 };

const status = u => u.deleted ? 'entfernt' : u.pending ? 'wartend' : u.blocked ? 'gesperrt' : 'aktiv';
const groups = () => S.groups.length ? S.groups : DEFAULT_GROUPS;
const gname = id => (groups().find(g => g.id === id) || {}).name || '';
const userList = () => Object.entries(S.users).map(([id, d]) => Object.assign({ id }, d));
const uname = id => (S.users[id] || {}).name || '(unbekannt)';
const cfg = () => Object.assign({}, CFG_DEF, S.cfg || {});
const sollFor = (uid, y) => { const d = S.soll.find(x => x.id === uid + '_' + y); return d ? +d.soll : +cfg().soll; };
const istFor = uid => r2(S.std.filter(e => e.uid === uid).reduce((s, e) => s + (+e.stunden || 0), 0));
const isMe = id => S.user && id === S.user.uid;

/* ---------- Firebase ---------- */
async function boot() {
  const [appM, authM, fsM] = await Promise.all([import(FB + 'firebase-app.js'), import(FB + 'firebase-auth.js'), import(FB + 'firebase-firestore.js')]);
  F = Object.assign({}, authM, fsM);
  const app = appM.initializeApp(firebaseConfig);
  auth = authM.getAuth(app); db = fsM.getFirestore(app);
  F.onAuthStateChanged(auth, async u => {
    Object.keys(unsub).forEach(stop);
    S.user = u; S.isSuper = false;
    if (!u) return show('vLogin');
    show('vLoad');
    try { await F.getDoc(F.doc(db, 'supercheck', 'x')); S.isSuper = true; } catch (e) { S.isSuper = false; }
    if (!S.isSuper) return show('vDenied');
    show('vApp'); start();
  });
}
function show(v) { ['vLogin', 'vLoad', 'vDenied', 'vApp'].forEach(x => { $(x).hidden = x !== v; }); }

const docs = snap => snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
const fail = w => err => { console.error(w, err); S.err[w] = err.code || err.message; render(); };
let rT; const render = () => { clearTimeout(rT); rT = setTimeout(renderNow, 30); };

function start() {
  const c = n => F.collection(db, n);
  unsub.users = F.onSnapshot(c('users'), s => { S.users = {}; s.docs.forEach(d => { S.users[d.id] = d.data(); }); const me = S.users[S.user.uid]; S.me = (me && me.name) || S.user.email; render(); }, fail('Mitglieder'));
  unsub.groups = F.onSnapshot(F.doc(db, 'config', 'groups'), s => { const d = s.exists() ? s.data() : null; S.groups = d && Array.isArray(d.list) ? d.list : []; render(); }, fail('Gruppen'));
  unsub.msgs = F.onSnapshot(F.query(c('msgs'), F.orderBy('t', 'desc'), F.limit(300)), s => { S.msgs = docs(s); render(); }, fail('Posteingang'));
  unsub.reqs = F.onSnapshot(F.query(c('reqs'), F.where('status', '==', 'open')), s => { S.reqs = docs(s); render(); }, fail('Anträge'));
  unsub.log = F.onSnapshot(F.query(c('log'), F.orderBy('t', 'desc'), F.limit(400)), s => { S.log = docs(s); render(); }, fail('Protokoll'));
  unsub.cfg = F.onSnapshot(F.doc(db, 'stdcfg', 'main'), s => { S.cfg = s.exists() ? s.data() : {}; render(); }, fail('Stunden-Einstellungen'));
  unsub.soll = F.onSnapshot(c('stdsoll'), s => { S.soll = docs(s); render(); }, fail('Soll'));
  unsub.inv = F.onSnapshot(c('stdinv'), s => { S.inv = docs(s); render(); }, fail('Rechnungen'));
  unsub.rem = F.onSnapshot(c('stdrem'), s => { S.rem = docs(s); render(); }, fail('Erinnerungen'));
  unsub.days = F.onSnapshot(F.query(c('days'), F.orderBy('date', 'desc'), F.limit(150)), s => { S.days = docs(s); if (S.recon.t) reconCheck(true); render(); }, fail('Tage'));
  unsub.products = F.onSnapshot(c('products'), s => { S.products = docs(s); render(); }, fail('Getränke'));
  unsub.meta = F.onSnapshot(F.doc(db, 'meta', 'state'), s => { S.activeDay = s.exists() ? s.data().active || null : null; render(); }, fail('Aktiver Tag'));
  listenStd();
  loadCounts();
  setTimeout(() => reconCheck(false), 2500);
}
function listenStd() {
  stop('std');
  const y = S.stdYear;
  unsub.std = F.onSnapshot(F.query(F.collection(db, 'stunden'), F.where('datum', '>=', y + '-01-01'), F.where('datum', '<=', y + '-12-31')),
    s => { S.std = docs(s); render(); }, fail('Stunden'));
}
async function loadCounts() {
  const sc = F.collection(db, 'scans');
  try {
    const [all, d30] = await Promise.all([F.getCountFromServer(sc), F.getCountFromServer(F.query(sc, F.where('t', '>=', Date.now() - 30 * 864e5)))]);
    S.counts.scans = all.data().count; S.counts.scans30 = d30.data().count;
  } catch (e) { console.warn('Zählen', e); S.counts.scans = null; }
  render();
}

/* ---------- Schreiben ---------- */
function logEv(text) {
  F.setDoc(F.doc(F.collection(db, 'log')), { t: Date.now(), date: todayISO(), uid: S.user.uid, who: S.me || '', type: 'person', text: ('[Verwaltung] ' + text).slice(0, 300), day: null })
    .catch(e => console.warn('Protokoll', e));
}
async function upd(id, data, what, logText) {
  try { await F.updateDoc(F.doc(db, 'users', id), data); if (logText) logEv(logText); return true; }
  catch (e) { console.error(what, e); toast('Fehler bei „' + what + '“: ' + (e.code || e.message)); return false; }
}
const A = {
  approve: (id, std) => upd(id, std ? { pending: false, std: true } : { pending: false }, 'Freischalten', 'schaltet ' + uname(id) + ' frei' + (std ? ' (inkl. Stundentracker)' : '')).then(ok => ok && toast(uname(id) + ' freigeschaltet')),
  reject: async id => { if (await ask('Anmeldung von „' + uname(id) + '“ ablehnen?', 'Ablehnen', true)) upd(id, { pending: false, deleted: true, blocked: true }, 'Ablehnen', 'lehnt die Anmeldung von ' + uname(id) + ' ab'); },
  block: async id => { if (await ask('„' + uname(id) + '“ sperren?\nDas Konto ist dann in Strichliste UND Stundentracker gesperrt.', 'Sperren', true)) upd(id, { blocked: true }, 'Sperren', 'sperrt ' + uname(id)); },
  unblock: id => upd(id, { blocked: false }, 'Entsperren', 'entsperrt ' + uname(id)),
  remove: async id => {
    if (!await ask('„' + uname(id) + '“ entfernen?\nDas Konto wird in beiden Apps gesperrt und ausgeblendet, Rollen werden entzogen. Buchungen und Stunden bleiben erhalten.\n\nBuchungen mitlöschen geht nur in der Strichliste (dort werden die Tageszähler neu berechnet).', 'Entfernen', true)) return;

  role: (id, v) => upd(id, { role: v || F.deleteField() }, 'Rolle', uname(id) + ': Strichliste-Rolle → ' + ROLE[v || '']),
  std: (id, on) => upd(id, on ? { std: true } : { std: false, sr: F.deleteField() }, 'Stundentracker', uname(id) + ': Stundentracker ' + (on ? 'freigegeben' : 'entzogen')),
  sr: (id, v) => upd(id, v ? { sr: v, std: true } : { sr: F.deleteField() }, 'Stunden-Rolle', uname(id) + ': Stunden-Rolle → ' + SR[v || '']),
  minor: (id, on) => upd(id, { minor: on }, 'Jugendschutz', uname(id) + ': ' + (on ? 'als minderjährig markiert' : 'nicht mehr minderjährig')),

  },
  clearDelreq: id => upd(id, { delreq: F.deleteField() }, 'Löschantrag', 'setzt den Löschantrag von ' + uname(id) + ' zurück'),
  purge: async id => {
    const n = uname(id);
    const r = await dialog('Profil von „' + n + '“ ENDGÜLTIG löschen?\n\nGelöscht wird nur das Profil-Dokument (users). Buchungen, Stunden und das Firebase-Login bleiben bestehen. Das Login löschst du in der Firebase-Konsole unter Authentication.\n\nZum Bestätigen den Namen eingeben:', ['Endgültig löschen', 'Abbrechen'], { input: '', placeholder: n, danger: true });
    if (r.i !== 0) return; if ((r.v || '').trim() !== n) return toast('Name stimmt nicht – nichts gelöscht.');
    try { await F.deleteDoc(F.doc(db, 'users', id)); logEv('löscht das Profil von ' + n + ' endgültig'); closeDrawer(); toast('Profil gelöscht'); }
    catch (e) { toast('Löschen fehlgeschlagen: ' + (e.code || e.message)); }
  }
};

/* Abgleich Strichliste: mitgenommen − gebucht − übrig (wie in der Strichliste)
   Gezählt per Zählabfrage je Tag und Getränk (kostet kaum Lesevorgänge). */
const PR = id => S.products.find(p => p.id === id) || { id, name: '(gelöschtes Getränk)', price: 0 };
const money = n => eur(n);
const dayKey = d => JSON.stringify([d.load || {}, d.count || {}, d.closed || false]);
async function reconDay(d) {
  const sc = F.collection(db, 'scans'), cnt = q => F.getCountFromServer(q).then(r => r.data().count);
  const load = d.load || {}, count = d.count || {};
  const ids = new Set(Object.keys(load).filter(k => load[k] > 0));
  Object.keys(count).forEach(k => { if (count[k] != null) ids.add(k); });
  const total = await cnt(F.query(sc, F.where('day', '==', d.id)));
  const used = {};
  await Promise.all([...ids].map(async pid => { used[pid] = await cnt(F.query(sc, F.where('day', '==', d.id), F.where('p', '==', pid))); }));
  // Buchungen von Getränken, die nicht mitgenommen wurden
  let rest = total - Object.values(used).reduce((a, b) => a + b, 0);
  if (rest > 0) for (const p of S.products) { if (rest <= 0) break; if (ids.has(p.id)) continue; const n = await cnt(F.query(sc, F.where('day', '==', d.id), F.where('p', '==', p.id))); if (n) { used[p.id] = n; ids.add(p.id); rest -= n; } }
  const rows = [...ids].map(pid => {
    const p = PR(pid), l = load[pid] || 0, u = used[pid] || 0, sl = l - u, c = count[pid] == null ? null : count[pid];
    return { pid, name: p.name, price: +p.price || 0, l, u, sl, c, diff: c == null ? null : c - sl };
  }).sort((a, b) => (a.diff == null ? 0 : a.diff) - (b.diff == null ? 0 : b.diff) || a.name.localeCompare(b.name, 'de'));
  const missR = rows.filter(r => r.diff != null && r.diff < 0);
  let undos = [];
  if (missR.length) { try { undos = docs(await F.getDocs(F.query(F.collection(db, 'undos'), F.where('day', '==', d.id)))).filter(u => missR.some(r => r.pid === u.p)).sort((a, b) => a.t - b.t); } catch (e) { } }
  return {
    key: dayKey(d), total, rows, undos,
    miss: missR.reduce((a, r) => a - r.diff, 0), val: missR.reduce((a, r) => a - r.diff * r.price, 0),
    over: rows.filter(r => r.diff != null && r.diff > 0).reduce((a, r) => a + r.diff, 0),
    unloaded: rows.filter(r => r.l === 0 && r.u > 0).reduce((a, r) => a + r.u, 0),
    beyond: rows.filter(r => r.l > 0 && r.u > r.l).reduce((a, r) => a + r.u - r.l, 0),
    uncounted: rows.filter(r => r.l > 0 && r.c == null).length,
    counted: rows.some(r => r.c != null)
  };
}
async function reconCheck(onlyChanged) {
  if (S.recon.busy) return;
  const R = S.recon, list = S.days.filter(d => !onlyChanged || !R.list[d.id] || R.list[d.id].key !== dayKey(d) || d.id === S.activeDay);
  if (onlyChanged && !list.length) return;
  R.busy = true; R.n = list.length; R.done = 0; render();
  try {
    const queue = list.slice();
    await Promise.all(Array.from({ length: 5 }, async () => { while (queue.length) { const d = queue.shift(); try { R.list[d.id] = await reconDay(d); } catch (e) { console.warn('Abgleich', d.id, e); R.list[d.id] = { err: e.code || e.message, key: dayKey(d), rows: [] }; } R.done++; render(); } }));
    Object.keys(R.list).forEach(id => { if (!S.days.some(d => d.id === id)) delete R.list[id]; });
    R.t = Date.now();
  } finally { R.busy = false; render(); }
}

  if (ms.last && ms.last.length) h += '<small class="mut">Letzte Einträge: ' + ms.last.map(e => esc(e.datum.slice(8, 10) + '.' + e.datum.slice(5, 7) + '.' + e.datum.slice(2, 4)) + ' ' + nf(e.stunden) + ' h ' + esc(e.taetigkeit || '')).join(' · ') + '</small>';
  h += '<h3>Aktionen</h3><div class="acts">';
  if (s === 'wartend') h += '<button class="btn pri" data-a="approve" data-id="' + id + '">Freischalten</button><button class="btn" data-a="approveStd" data-id="' + id + '">Freischalten + Stundentracker</button><button class="btn dng" data-a="reject" data-id="' + id + '">Ablehnen</button>';
  h += '<button class="btn" data-a="rename" data-id="' + id + '">Name ändern</button>';
  if (!isMe(id)) {
    if (s === 'aktiv') h += '<button class="btn dng" data-a="block" data-id="' + id + '">Sperren</button>';
    if (s === 'gesperrt') h += '<button class="btn" data-a="unblock" data-id="' + id + '">Entsperren</button>';
    if (s !== 'entfernt') h += '<button class="btn dng" data-a="remove" data-id="' + id + '">Entfernen</button>';
    if (s === 'entfernt') h += '<button class="btn" data-a="restore" data-id="' + id + '">Wiederherstellen</button><button class="btn dng" data-a="purge" data-id="' + id + '">Profil endgültig löschen</button>';
  }
  if (u.delreq) h += '<button class="btn" data-a="clearDelreq" data-id="' + id + '">Löschantrag zurücksetzen</button>';
  h += '</div>';
  const msgs = S.msgs.filter(m => m.uid === id).slice(0, 3);
  if (msgs.length) h += '<h3>Nachrichten</h3>' + msgs.map(m => '<div class="reply">' + kindIcon(m.kind) + ' ' + dtt(m.t) + ': ' + esc(String(m.text).slice(0, 160)) + '</div>').join('');
  const lg = S.log.filter(l => l.uid === id || (l.text || '').includes(u.name)).slice(0, 8);
  if (lg.length) h += '<h3>Protokoll</h3>' + lg.map(l => '<div style="font-size:.84rem;margin:4px 0"><span class="mut">' + dtt(l.t) + '</span> <b>' + esc(l.who) + '</b> ' + esc(l.text) + '</div>').join('');
  $('drawer').innerHTML = h;
}

/* ---------- Excel ---------- */
function xls(name, sheets) {
  if (!window.XLSX) return toast('Excel-Bibliothek nicht geladen.');
  const wb = XLSX.utils.book_new();
  sheets.forEach(([n, rows]) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), n));
  XLSX.writeFile(wb, name + '_' + todayISO() + '.xlsx');
}

/* ---------- Ereignisse ---------- */
$('fLogin').onsubmit = async e => {
  e.preventDefault(); $('lErr').hidden = true;
  try { await F.signInWithEmailAndPassword(auth, $('lMail').value.trim(), $('lPw').value); $('lPw').value = ''; }
  catch (err) { $('lErr').hidden = false; $('lErr').textContent = ['auth/invalid-credential', 'auth/wrong-password', 'auth/user-not-found'].includes(err.code) ? 'E-Mail oder Passwort falsch.' : 'Anmeldung fehlgeschlagen: ' + (err.code || err.message); }
};
$('bOut').onclick = $('bDeniedOut').onclick = () => F.signOut(auth);
$('shade').onclick = closeDrawer;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.drawer && $('modal').hidden) closeDrawer(); });
$('nav').onclick = e => { const b = e.target.closest('button[data-v]'); if (b) go(b.dataset.v); };
function go(v) {
  const [view, arg] = v.split(':');
  if (view === 'members') { S.mf = { q: '', status: '', role: '', std: '', grp: '', sort: 'name' }; if (arg === 'std') S.mf.std = 'yes'; else if (arg) S.mf.status = arg; if (arg === 'aktiv') S.mf.status = 'aktiv'; }
  if (view === 'hours') S.hoursF = arg || '';
  S.view = view; renderNow(); window.scrollTo(0, 0);
}

document.addEventListener('click', async e => {
  const g = e.target.closest('[data-go]'); if (g) return go(g.dataset.go);
  const o = e.target.closest('[data-open]'); if (o) return openDrawer(o.dataset.open);
  const m = e.target.closest('[data-m]'); if (m) return msgAct(m.dataset.m, m.dataset.id);
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, id = b.dataset.id;
  if (a === 'close') return closeDrawer();
  if (a === 'approveStd') return A.approve(id, true);
  if (A[a]) return A[a](id);
  if (a === 'fixSr') return upd(id, { sr: F.deleteField() }, 'Beheben', uname(id) + ': Stunden-Rolle entfernt (keine Freigabe)');
  if (a === 'fixRoles') return upd(id, { role: F.deleteField(), sr: F.deleteField() }, 'Beheben', uname(id) + ': Rollen entzogen (gesperrt/entfernt)');
  if (a === 'fixStd') return upd(id, { std: false }, 'Beheben', uname(id) + ': Stundentracker-Freigabe entzogen (entfernt)');
  if (a === 'reconRun') return reconCheck(false);
  if (a === 'xlsRecon') return xls('Abgleich', [['Abgleich', S.days.filter(d => S.recon.list[d.id]).flatMap(d => S.recon.list[d.id].rows.map(x => ({ Datum: d.date, Ort: d.place || '', Getränk: x.name, Mitgenommen: x.l, Gebucht: x.u, 'Müsste übrig sein': x.sl, 'Übrig gezählt': x.c == null ? '' : x.c, Differenz: x.diff == null ? '' : x.diff, 'Wert fehlend': x.diff < 0 ? -x.diff * x.price : '' })))]]);
  if (a === 'bulkClear') { S.sel.clear(); return render(); }
  if (a.startsWith('bulk')) return bulk(a);
  if (a === 'xlsMembers') return xls('Mitglieder', [['Mitglieder', filteredMembers().map(u => ({ Name: u.name, 'E-Mail': u.email || '', Status: STATUS[status(u)], Gruppe: gname(u.grp), 'Strichliste-Rolle': ROLE[u.role || ''], Minderjährig: u.minor ? 'ja' : '', Stundentracker: u.std === true ? 'ja' : '', 'Stunden-Rolle': u.sr ? SR[u.sr] : '', ['Stunden ' + S.stdYear]: u.std === true ? istFor(u.id) : '', Registriert: dt(u.t), Löschantrag: u.delreq ? dt(u.delreq) : '', 'Nutzer-ID': u.id }))]]);
  if (a === 'xlsHours') return xls('Pflichtstunden_' + S.stdYear, [['Pflichtstunden', hoursRows().map(r => ({ Name: r.u.name, Gruppe: gname(r.u.grp), Ist: r.ist, Soll: r.soll, Fehlt: r.fehl, Erinnerungen: r.rem, Rechnung: r.inv ? r.inv.nr : '', Betrag: r.inv ? r.inv.betrag : '', Bezahlt: r.inv ? (r.inv.paid ? 'ja' : 'nein') : '' }))],
    ['Einträge', S.std.slice().sort((x, y) => x.datum.localeCompare(y.datum)).map(e => ({ Datum: e.datum, Name: e.name, Stunden: e.stunden, Tätigkeit: e.taetigkeit, Notiz: e.notiz }))]]);
});
async function bulk(a) {
  const ids = [...S.sel].filter(id => S.users[id] && !S.users[id].deleted); if (!ids.length) return;
  const map = { bulkApprove: ['Freischalten', { pending: false }, u => u.pending], bulkStdOn: ['Stundentracker freigeben', { std: true }, u => u.std !== true], bulkStdOff: ['Stundentracker entziehen', { std: false, sr: F.deleteField() }, u => u.std === true] };
  const [label, data, need] = map[a];
  const todo = ids.filter(id => need(S.users[id])); if (!todo.length) return toast('Bei der Auswahl ist nichts zu ändern.');
  if (!await ask(label + ' für ' + todo.length + ' Person(en)?', label)) return;
  try { const wb = F.writeBatch(db); todo.forEach(id => wb.update(F.doc(db, 'users', id), data)); await wb.commit(); logEv(label + ': ' + todo.map(uname).join(', ')); toast(label + ': ' + todo.length + ' erledigt'); S.sel.clear(); render(); }
  catch (e) { toast('Fehler: ' + (e.code || e.message)); }
}
async function msgAct(a, id) {
  const m = S.msgs.find(x => x.id === id); if (!m) return;
  const u = d => F.updateDoc(F.doc(db, 'msgs', id), d).catch(e => toast('Fehler: ' + (e.code || e.message)));
  if (a === 'read') u({ read: true }); if (a === 'unread') u({ read: false });
  if (a === 'done') u({ status: 'done', read: true }); if (a === 'reopen') u({ status: 'open' });
  if (a === 'reply') {
    const r = await dialog('Antwort an ' + m.name + ' (erscheint in der App):', ['Senden', 'Abbrechen'], { input: m.reply || '', textarea: true });
    if (r.i !== 0) return; const t = (r.v || '').trim().slice(0, 1000); if (!t) return toast('Bitte eine Antwort schreiben.');
    await u({ reply: t, replyAt: Date.now(), replyBy: S.me, read: true }); logEv('antwortet ' + m.name + ' im Posteingang'); toast('Antwort gespeichert');
  }
  if (a === 'del' && await ask('Nachricht von ' + m.name + ' löschen?', 'Löschen', true)) F.deleteDoc(F.doc(db, 'msgs', id)).catch(e => toast('Fehler: ' + (e.code || e.message)));
}
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.f) {
    const id = t.dataset.id, f = t.dataset.f;
    if (f === 'role') return A.role(id, t.value);
    if (f === 'sr') return A.sr(id, t.value);
    if (f === 'std') return A.std(id, t.checked);
    if (f === 'minor') return A.minor(id, t.checked);
    if (f === 'grp') return A.grp(id, t.value);
  }
  if (t.dataset.sel) { t.checked ? S.sel.add(t.dataset.sel) : S.sel.delete(t.dataset.sel); return render(); }
  if (t.id === 'selAll') { filteredMembers().forEach(u => t.checked ? S.sel.add(u.id) : S.sel.delete(u.id)); return render(); }
  if (t.id === 'bulkGrp' && t.value) {
    const ids = [...S.sel].filter(id => S.users[id] && !S.users[id].deleted), g = t.value;
    ask('Gruppe „' + gname(g) + '“ für ' + ids.length + ' Person(en) setzen?', 'Setzen').then(async ok => {
      if (!ok) return render();
      try { const wb = F.writeBatch(db); ids.forEach(id => wb.update(F.doc(db, 'users', id), { grp: g })); await wb.commit(); logEv('Gruppe ' + gname(g) + ': ' + ids.map(uname).join(', ')); toast('Gruppe gesetzt'); S.sel.clear(); render(); }
      catch (err) { toast('Fehler: ' + (err.code || err.message)); }
    });
    return;
  }
  const mf = { mfS: 'status', mfR: 'role', mfT: 'std', mfG: 'grp', mfO: 'sort' }[t.id]; if (mf) { S.mf[mf] = t.value; return render(); }
  if (t.id === 'hY') { S.stdYear = t.value; listenStd(); return render(); }
  if (t.id === 'hF') { S.hoursF = t.value; return render(); }
  if (t.id === 'rcF') { S.reconF = t.value; return render(); }
  if (t.id === 'iF') { S.inboxF = t.value; return render(); }
  if (t.id === 'lgT') { S.logF.type = t.value; return render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'mfQ') { S.mf.q = e.target.value; render(); }
  if (e.target.id === 'lgQ') { S.logF.q = e.target.value; render(); }
});

/* ---------- Installieren ---------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW', e));
let instEv = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); instEv = e; $('bInst').hidden = false; });
window.addEventListener('appinstalled', () => { instEv = null; $('bInst').hidden = true; toast('WexSuperAdmin installiert'); });
$('bInst').onclick = async () => { if (!instEv) return; instEv.prompt(); await instEv.userChoice; instEv = null; $('bInst').hidden = true; };

boot().catch(e => { console.error(e); $('vLoad').innerHTML = '<div class="err">Firebase konnte nicht geladen werden: ' + esc(e.message) + '</div>'; });
</script>
</body>
